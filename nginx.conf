server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single origin for the SPA and the API: the session cookie (Path=/api,
    # HttpOnly, SameSite=Lax) only works if the browser sees one site. Proxying
    # /api here also removes the need for CORS with credentials.
    # No trailing slash on proxy_pass: the /api prefix is forwarded as-is.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

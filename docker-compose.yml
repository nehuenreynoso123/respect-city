services:
  postgres:
    image: postgres:16-alpine
    container_name: respect-city-postgres
    environment:
      POSTGRES_USER: respect
      POSTGRES_PASSWORD: respect
      POSTGRES_DB: respect_city
    ports:
      - "5432:5432"
    volumes:
      - respect-city-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U respect -d respect_city"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  respect-city-pgdata:
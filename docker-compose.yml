services:
  postgres:
    image: postgres:16-alpine
    container_name: respect-city-postgres
    environment:
      POSTGRES_USER: respect
      POSTGRES_PASSWORD: respect
      POSTGRES_DB: respect_city
    ports:
      - "5432:5432"
    volumes:
      - respect-city-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U respect -d respect_city"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: respect-city-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Inside the Compose network the DB host is the service name `postgres`.
      DATABASE_URL: ${DATABASE_URL:-postgresql://respect:respect@postgres:5432/respect_city}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Session cookie `Secure` flag. The bundled frontend serves plain HTTP on
      # :8080, so a Secure cookie would be dropped by the browser: keep it false
      # until the stack sits behind TLS, then set COOKIE_SECURE=true.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
    container_name: respect-city-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  respect-city-pgdata:

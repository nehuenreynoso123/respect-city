<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RESPECT CITY — Mission Control</title>

<!-- Retro arcade fonts (Google Fonts, with system fallbacks for offline use) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
/* ============================================================
   RESPECT CITY — GTA Vice City / San Andreas themed SPA
   Palette: deep blue #0d0f18 · neon pink #ff007f
            cyan #00f3ff · gold #ffd700
   ============================================================ */

:root{
  --bg:        #0d0f18;   /* deep night blue */
  --bg-soft:   #141830;   /* panels */
  --pink:      #ff007f;   /* neon magenta */
  --cyan:      #00f3ff;   /* neon cyan */
  --gold:      #ffd700;   /* GTA gold */
  --green:     #3dff8a;   /* completion */
  --text:      #e8ecff;
  --muted:     #8a91c4;
  --track:     #232849;
}

*{ box-sizing:border-box; margin:0; padding:0; }

html,body{ height:100%; }

body{
  background:
    radial-gradient(ellipse at 50% -20%, #1b1040 0%, transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:'Rajdhani','Segoe UI',system-ui,sans-serif;
  overflow:hidden;                 /* single-page: no document scroll */
  -webkit-font-smoothing:antialiased;
}

button{ font-family:inherit; cursor:pointer; }

/* ------------------------------------------------------------
   HUD HEADER — player profile + stats bars
   ------------------------------------------------------------ */
#hud{
  position:relative; z-index:30;
  display:flex; align-items:center; gap:18px;
  padding:10px 16px;
  background:linear-gradient(180deg, #171c38 0%, var(--bg) 100%);
  border-bottom:2px solid var(--pink);
  box-shadow:0 4px 24px rgba(255,0,127,.35);
  flex-wrap:wrap;
}

.logo{
  font-family:'Bungee',sans-serif;
  font-size:22px; letter-spacing:1px;
  color:var(--gold);
  text-shadow:0 0 12px rgba(255,215,0,.7), 3px 3px 0 var(--pink);
  user-select:none; white-space:nowrap;
}
.logo span{ color:var(--cyan); text-shadow:0 0 12px rgba(0,243,255,.7), 3px 3px 0 #000; }

/* Stat block: label + progress bar */
.stat{ min-width:130px; flex:1; max-width:220px; }
.stat-label{
  display:flex; justify-content:space-between;
  font-size:12px; font-weight:700; letter-spacing:1.5px;
  color:var(--muted); text-transform:uppercase; margin-bottom:3px;
}
.stat-label b{ color:var(--gold); font-size:13px; }

.bar{
  height:12px; background:var(--track);
  border:1px solid #33396b; border-radius:6px; overflow:hidden;
  position:relative;
}
.bar-fill{
  height:100%; width:0%;
  border-radius:6px;
  transition:width .5s cubic-bezier(.22,1,.36,1);
  box-shadow:0 0 10px currentColor;
}
.bar-fill.exp     { background:linear-gradient(90deg,var(--pink),var(--gold)); color:var(--gold); }
.bar-fill.stamina { background:linear-gradient(90deg,#ff5ea8,var(--pink)); color:var(--pink); }
.bar-fill.intel   { background:linear-gradient(90deg,#4dd7ff,var(--cyan)); color:var(--cyan); }
.bar-fill.coins   { background:linear-gradient(90deg,#b8860b,var(--gold)); color:var(--gold); }

.hud-actions{ display:flex; gap:8px; margin-left:auto; }

/* Chunky arcade buttons */
.btn{
  background:var(--bg-soft); color:var(--text);
  border:2px solid var(--cyan); border-radius:6px;
  padding:8px 14px;
  font-family:'Bungee',sans-serif; font-size:12px; letter-spacing:1px;
  text-transform:uppercase;
  transition:.15s;
}
.btn:hover{ background:var(--cyan); color:#031018; box-shadow:0 0 16px rgba(0,243,255,.6); }
.btn-gold{ border-color:var(--gold); color:var(--gold); }
.btn-gold:hover{ background:var(--gold); color:#1a1400; box-shadow:0 0 16px rgba(255,215,0,.6); }
.btn-pink{ border-color:var(--pink); color:var(--pink); }
.btn-pink:hover{ background:var(--pink); color:#fff; box-shadow:0 0 16px rgba(255,0,127,.6); }
#btn-list{ display:none; }        /* only on mobile */

/* ------------------------------------------------------------
   MAIN LAYOUT — sidebar list + map
   ------------------------------------------------------------ */
#app{
  display:flex;
  height:calc(100vh - 62px);      /* viewport minus HUD */
}

/* --- Mission list sidebar --- */
#mission-list{
  width:290px; flex-shrink:0;
  background:rgba(13,15,24,.92);
  border-right:2px solid #232849;
  display:flex; flex-direction:column;
  z-index:20;
}
.list-head{
  padding:14px 14px 8px;
  font-family:'Bungee',sans-serif; font-size:14px;
  color:var(--cyan); letter-spacing:1px;
  text-shadow:0 0 8px rgba(0,243,255,.5);
}
.filters{ display:flex; gap:6px; padding:0 14px 10px; }
.chip{
  font-size:11px; font-weight:700; letter-spacing:1px;
  padding:4px 10px; border-radius:12px;
  background:transparent; color:var(--muted);
  border:1px solid #33396b; text-transform:uppercase;
}
.chip.active{ background:var(--pink); color:#fff; border-color:var(--pink); box-shadow:0 0 10px rgba(255,0,127,.5); }

.list-scroll{ overflow-y:auto; flex:1; padding:0 10px 14px; }

.mission-card{
  display:flex; align-items:center; gap:10px;
  background:var(--bg-soft);
  border:1px solid #2a3057; border-left:4px solid var(--muted);
  border-radius:8px; padding:10px; margin-bottom:8px;
  cursor:pointer; transition:.15s;
}
.mission-card:hover{ border-color:var(--cyan); transform:translateX(3px); }
.mission-card.selected{ border-color:var(--cyan); box-shadow:0 0 12px rgba(0,243,255,.35); }
.mission-card.done{ opacity:.55; border-left-color:var(--green); }

.mc-icon{
  width:36px; height:36px; flex-shrink:0;
  display:grid; place-items:center; font-size:18px;
  background:#0a0d1c; border:2px solid var(--muted); border-radius:50%;
}
.mc-body{ flex:1; min-width:0; }
.mc-title{
  font-weight:700; font-size:14px; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis;
}
.mc-meta{
  display:flex; gap:8px; align-items:center;
  font-size:11px; color:var(--muted); margin-top:2px;
  text-transform:uppercase; letter-spacing:.5px;
}
.mc-respect{ color:var(--gold); font-weight:700; }
.mc-check{ font-size:16px; color:var(--green); }

.list-empty{
  text-align:center; color:var(--muted);
  font-size:13px; padding:30px 16px; line-height:1.6;
}
.list-empty b{ color:var(--gold); }

/* --- Map viewport --- */
#map-viewport{
  position:relative; flex:1; overflow:hidden;
  background:#071026;              /* open sea */
  touch-action:none;              /* enables custom pan/zoom on touch */
  cursor:grab;
}
#map-viewport.dragging{ cursor:grabbing; }
#map-viewport.pick-mode{ cursor:crosshair; }

/* World holds the SVG map + HTML markers; pan/zoom via one transform */
#world{
  position:absolute; top:0; left:0;
  width:2400px; height:1600px;
  transform-origin:0 0;
  --inv:1;                        /* inverse zoom, set by JS to keep marker size */
}
#city-map{ position:absolute; inset:0; width:2400px; height:1600px; }

/* --- Mission markers --- */
#markers{ position:absolute; inset:0; }
.marker{
  position:absolute;
  transform:translate(-50%,-100%) scale(var(--inv));
  transform-origin:50% 100%;
  display:flex; flex-direction:column; align-items:center;
  cursor:pointer; user-select:none;
}
.marker-chip{
  width:44px; height:44px;
  display:grid; place-items:center; font-size:20px;
  background:rgba(10,13,28,.92);
  border:3px solid var(--muted); border-radius:50% 50% 50% 4px;
  rotate:45deg;                    /* pin drop shape */
  box-shadow:0 4px 12px rgba(0,0,0,.6);
  transition:.15s;
}
.marker-chip span{ rotate:-45deg; }
.marker:hover .marker-chip{ transform:scale(1.15); box-shadow:0 0 18px currentColor; }
.marker.done .marker-chip{ filter:grayscale(.7); opacity:.65; border-color:var(--green); }
.marker.done::after{
  content:'✓';
  position:absolute; top:-6px; right:-6px;
  width:20px; height:20px; font-size:13px; font-weight:700;
  background:var(--green); color:#052; border-radius:50%;
  display:grid; place-items:center;
}
.marker .marker-tag{
  margin-top:6px;
  font-size:11px; font-weight:700; letter-spacing:.5px;
  color:#fff; background:rgba(0,0,0,.7);
  padding:2px 7px; border-radius:4px;
  white-space:nowrap; max-width:150px; overflow:hidden; text-overflow:ellipsis;
}
/* Category accent colors (set inline per marker) */
.cat-gym   { color:#ff007f; } .cat-gym   .marker-chip{ border-color:#ff007f; }
.cat-code  { color:#00f3ff; } .cat-code  .marker-chip{ border-color:#00f3ff; }
.cat-work  { color:#ffd700; } .cat-work  .marker-chip{ border-color:#ffd700; }
.cat-health{ color:#3dff8a; } .cat-health .marker-chip{ border-color:#3dff8a; }

/* Map furniture */
#map-hint{
  position:absolute; left:50%; bottom:18px; transform:translateX(-50%);
  background:rgba(0,0,0,.72); border:1px solid var(--cyan);
  color:var(--cyan); padding:7px 16px; border-radius:20px;
  font-size:12px; font-weight:700; letter-spacing:2px;
  text-transform:uppercase; pointer-events:none;
  box-shadow:0 0 14px rgba(0,243,255,.35);
  z-index:10;
}
#zoom-controls{
  position:absolute; right:14px; bottom:14px;
  display:flex; flex-direction:column; gap:6px; z-index:10;
}
#zoom-controls button{
  width:38px; height:38px; font-size:18px; font-weight:700;
  background:rgba(13,15,24,.9); color:var(--cyan);
  border:2px solid var(--cyan); border-radius:8px;
}
#zoom-controls button:hover{ background:var(--cyan); color:#031018; }

/* ------------------------------------------------------------
   MISSION PANEL (checklist HUD)
   ------------------------------------------------------------ */
#mission-panel{
  position:fixed; top:70px; right:14px; bottom:14px;
  width:350px; max-width:calc(100vw - 28px);
  background:rgba(15,18,38,.97);
  border:2px solid var(--cyan); border-radius:12px;
  box-shadow:0 0 30px rgba(0,243,255,.3), 0 20px 60px rgba(0,0,0,.6);
  z-index:40;
  display:flex; flex-direction:column;
  transform:translateX(calc(100% + 30px));
  transition:transform .3s cubic-bezier(.22,1,.36,1);
}
#mission-panel.open{ transform:translateX(0); }

.panel-head{
  display:flex; gap:12px; align-items:flex-start;
  padding:16px 16px 10px;
  border-bottom:1px solid #2a3057;
}
#panel-icon{
  width:44px; height:44px; flex-shrink:0;
  display:grid; place-items:center; font-size:22px;
  background:#0a0d1c; border:3px solid var(--muted); border-radius:50%;
}
.panel-head h2{
  font-family:'Bungee',sans-serif; font-size:17px; line-height:1.3;
  color:var(--gold); text-shadow:0 0 10px rgba(255,215,0,.4);
}
.panel-meta{
  display:flex; gap:10px; margin-top:5px;
  font-size:11px; font-weight:700; letter-spacing:1px;
  text-transform:uppercase; color:var(--muted);
}
.panel-meta .respect{ color:var(--gold); }
#panel-close{
  margin-left:auto; background:none; border:none;
  color:var(--muted); font-size:24px; line-height:1;
}
#panel-close:hover{ color:var(--pink); }

.panel-progress{ padding:10px 16px 0; }
.panel-progress .bar{ height:10px; }
.panel-progress .bar-fill{ background:linear-gradient(90deg,var(--cyan),var(--green)); color:var(--green); }
.progress-text{
  font-size:11px; color:var(--muted); letter-spacing:1px;
  text-transform:uppercase; margin-top:5px; text-align:right;
}

#panel-items{ list-style:none; padding:12px 16px; overflow-y:auto; flex:1; }
.check-item{
  display:flex; align-items:center; gap:12px;
  padding:11px 12px; margin-bottom:8px;
  background:var(--bg-soft); border:1px solid #2a3057;
  border-radius:8px; cursor:pointer; transition:.15s;
}
.check-item:hover{ border-color:var(--pink); }
.check-item input{ display:none; }         /* custom checkbox below */
.check-box{
  width:22px; height:22px; flex-shrink:0;
  border:2px solid var(--cyan); border-radius:5px;
  display:grid; place-items:center;
  font-size:14px; font-weight:700; color:transparent;
  transition:.15s;
}
.check-item input:checked ~ .check-box{
  background:var(--green); border-color:var(--green); color:#052;
  box-shadow:0 0 10px rgba(61,255,138,.6);
}
.check-item input:checked ~ .check-text{
  color:var(--muted); text-decoration:line-through;
}
.check-text{ font-size:14px; font-weight:600; }

.panel-actions{ padding:12px 16px; border-top:1px solid #2a3057; }

/* ------------------------------------------------------------
   RESPECT+ FULL-SCREEN CELEBRATION
   ------------------------------------------------------------ */
#respect-overlay{
  position:fixed; inset:0; z-index:100;
  background:rgba(3,4,10,.88);
  display:grid; place-items:center;
  animation:ovl-in .18s ease-out;
}
@keyframes ovl-in{ from{opacity:0} to{opacity:1} }
.respect-inner{ text-align:center; padding:20px; }
.respect-big{
  font-family:'Press Start 2P',monospace;
  font-size:clamp(34px, 8vw, 92px);
  line-height:1.25;
  color:var(--gold);
  text-shadow:
    0 0 24px rgba(255,215,0,.9),
    0 0 60px rgba(255,0,127,.7),
    6px 6px 0 var(--pink);
  animation:respect-pop .55s cubic-bezier(.18,1.6,.4,1) both,
            respect-flicker 1.1s .55s steps(2,end) infinite;
}
@keyframes respect-pop{
  0%{ transform:scale(.2) rotate(-6deg); opacity:0; }
  100%{ transform:scale(1) rotate(0); opacity:1; }
}
@keyframes respect-flicker{
  0%,100%{ opacity:1; } 50%{ opacity:.82; }
}
.respect-sub{
  margin-top:26px;
  font-family:'Bungee',sans-serif;
  font-size:clamp(15px,2.6vw,26px);
  color:var(--cyan); letter-spacing:2px;
  text-shadow:0 0 14px rgba(0,243,255,.8);
  animation:respect-sub .5s .3s ease-out both;
}
@keyframes respect-sub{ from{ transform:translateY(16px); opacity:0 } to{ transform:none; opacity:1 } }
.respect-hint{
  margin-top:34px; font-size:12px; letter-spacing:2px;
  color:var(--muted); text-transform:uppercase;
}

/* ------------------------------------------------------------
   CREATE-MISSION MODAL
   ------------------------------------------------------------ */
#modal-backdrop{
  position:fixed; inset:0; z-index:90;
  background:rgba(3,4,10,.75);
  backdrop-filter:blur(3px);
  display:grid; place-items:center; padding:16px;
}
#modal-backdrop.hidden{ display:none; }
#mission-modal{
  width:440px; max-width:100%;
  max-height:90vh; overflow-y:auto;
  background:var(--bg-soft);
  border:2px solid var(--pink); border-radius:14px;
  box-shadow:0 0 40px rgba(255,0,127,.4), 0 30px 80px rgba(0,0,0,.7);
  padding:22px;
}
.modal-title{
  font-family:'Bungee',sans-serif; font-size:20px;
  color:var(--pink); letter-spacing:1px;
  text-shadow:0 0 12px rgba(255,0,127,.6);
  margin-bottom:18px;
}
.field{ margin-bottom:14px; }
.field label{
  display:block; font-size:11px; font-weight:700;
  letter-spacing:1.5px; text-transform:uppercase;
  color:var(--cyan); margin-bottom:5px;
}
.field input[type=text], .field input[type=number], .field select{
  width:100%; padding:10px 12px;
  background:#0a0d1c; color:var(--text);
  border:1px solid #33396b; border-radius:7px;
  font-family:inherit; font-size:14px; outline:none;
}
.field input:focus, .field select:focus{ border-color:var(--cyan); box-shadow:0 0 8px rgba(0,243,255,.4); }
.field-row{ display:flex; gap:12px; }
.field-row .field{ flex:1; }

/* Location readout + pick-on-map */
.loc-box{
  display:flex; align-items:center; gap:10px;
  background:#0a0d1c; border:1px dashed #33396b;
  border-radius:7px; padding:9px 12px;
}
#loc-text{ flex:1; font-size:13px; color:var(--muted); letter-spacing:1px; }
#loc-text.set{ color:var(--green); }
#btn-pick{
  background:none; border:1px solid var(--gold);
  color:var(--gold); border-radius:5px;
  padding:5px 10px; font-size:10px; font-weight:700;
  letter-spacing:1px; text-transform:uppercase; white-space:nowrap;
}
#btn-pick:hover{ background:var(--gold); color:#1a1400; }

/* Dynamic checklist editor */
#checklist-rows{ display:flex; flex-direction:column; gap:8px; }
.cl-row{ display:flex; gap:8px; }
.cl-row input{ flex:1; }
.cl-remove{
  width:38px; flex-shrink:0;
  background:transparent; color:var(--pink);
  border:1px solid var(--pink); border-radius:7px;
  font-size:16px;
}
.cl-remove:hover{ background:var(--pink); color:#fff; }
#btn-add-item{
  margin-top:8px; width:100%;
  background:transparent; color:var(--cyan);
  border:1px dashed var(--cyan); border-radius:7px;
  padding:8px; font-size:11px; font-weight:700;
  letter-spacing:1.5px; text-transform:uppercase;
}
#btn-add-item:hover{ background:rgba(0,243,255,.12); }

.modal-actions{ display:flex; gap:10px; margin-top:20px; }
.modal-actions .btn{ flex:1; }

/* ------------------------------------------------------------
   RESPONSIVE
   ------------------------------------------------------------ */
@media (max-width: 860px){
  #btn-list{ display:block; }              /* show sidebar toggle */
  #mission-list{
    position:fixed; top:62px; bottom:0; left:0;
    transform:translateX(-100%);
    transition:transform .25s ease;
    width:min(320px,85vw);
    box-shadow:8px 0 30px rgba(0,0,0,.6);
  }
  #mission-list.open{ transform:translateX(0); }
  #app{ height:calc(100vh - 110px); }      /* HUD wraps to 2 rows on mobile */
  .stat{ min-width:100px; }
  .logo{ font-size:17px; }
  #mission-panel{
    top:auto; right:0; left:0; bottom:0;
    width:100%; max-width:100%;
    height:62vh; border-radius:16px 16px 0 0;
    transform:translateY(110%);
  }
  #mission-panel.open{ transform:translateY(0); }
}
@media (max-width: 520px){
  #hud{ gap:8px; padding:8px 10px; }
  .stat{ max-width:none; min-width:calc(50% - 30px); }
  .hud-actions{ margin-left:0; width:100%; }
  .hud-actions .btn{ flex:1; }
}

/* Scrollbars, retro flavour */
::-webkit-scrollbar{ width:9px; }
::-webkit-scrollbar-track{ background:var(--bg); }
::-webkit-scrollbar-thumb{ background:#2f3566; border-radius:5px; }
::-webkit-scrollbar-thumb:hover{ background:var(--pink); }
</style>
</head>

<body>

<!-- ============================ HUD ============================ -->
<header id="hud">
  <div class="logo">RESPECT<span>CITY</span></div>

  <div class="stat">
    <div class="stat-label">Level <b id="level-num">1</b></div>
    <div class="bar"><div class="bar-fill exp" id="exp-bar"></div></div>
    <div class="stat-label" style="margin-top:2px"><span id="exp-text">0 / 500 EXP</span></div>
  </div>

  <div class="stat">
    <div class="stat-label">Stamina</div>
    <div class="bar"><div class="bar-fill stamina" id="stamina-bar"></div></div>
  </div>

  <div class="stat">
    <div class="stat-label">Intelligence</div>
    <div class="bar"><div class="bar-fill intel" id="intel-bar"></div></div>
  </div>

  <div class="stat">
    <div class="stat-label">Coins <b id="coins-num">0</b></div>
    <div class="bar"><div class="bar-fill coins" id="coins-bar"></div></div>
  </div>

  <div class="hud-actions">
    <button class="btn" id="btn-list" title="Mission list">☰</button>
    <button class="btn btn-gold" id="btn-new">+ New Mission</button>
    <button class="btn btn-pink" id="btn-sound" title="Toggle sound">🔊</button>
  </div>
</header>

<!-- ========================= MAIN APP ========================== -->
<div id="app">

  <!-- Mission list sidebar -->
  <aside id="mission-list">
    <div class="list-head">📋 MISSION LOG</div>
    <div class="filters">
      <button class="chip active" data-filter="all">All</button>
      <button class="chip" data-filter="active">Active</button>
      <button class="chip" data-filter="done">Done</button>
    </div>
    <div class="list-scroll" id="list-scroll"><!-- rendered by JS --></div>
  </aside>

  <!-- Interactive Vice City map -->
  <div id="map-viewport">
    <div id="world">
      <svg id="city-map" viewBox="0 0 2400 1600" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Ocean gradient -->
          <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0a1130"/>
            <stop offset="1" stop-color="#050a1d"/>
          </linearGradient>
          <!-- Land gradient -->
          <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1a2147"/>
            <stop offset="1" stop-color="#121632"/>
          </linearGradient>
          <!-- Synthwave sun -->
          <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffd700"/>
            <stop offset="1" stop-color="#ff007f"/>
          </linearGradient>
          <pattern id="waves" width="120" height="60" patternUnits="userSpaceOnUse">
            <path d="M0 30 q30 -12 60 0 t60 0" fill="none" stroke="#12205a" stroke-width="2"/>
          </pattern>
        </defs>

        <!-- OPEN SEA -->
        <rect width="2400" height="1600" fill="url(#sea)"/>
        <rect width="2400" height="1600" fill="url(#waves)" opacity=".55"/>

        <!-- Decorative synthwave sun (top-right, over the water) -->
        <g opacity=".8" transform="translate(2060,170)">
          <circle r="120" fill="url(#sun)" opacity=".9"/>

<script>
/* ==============================================================
   RESPECT CITY — application logic (vanilla JS, no dependencies)

   Sections:
     1. Constants & state          5. Mission panel
     2. Persistence (localStorage) 6. RESPECT+ celebration
     3. HUD rendering              7. Create-mission modal
     4. Map: pan/zoom/markers      8. Init & wiring
   ============================================================== */
'use strict';

/* ------------------------------------------------------------ *
 * 1. CONSTANTS & STATE
 * ------------------------------------------------------------ */
const STORAGE_KEY   = 'vice-tasks:v1';
const WORLD_W       = 2400;         // world size in px (SVG viewBox)
const WORLD_H       = 1600;
const EXP_PER_LEVEL = 500;          // EXP needed per level
const COIN_BAR_MAX  = 500;          // coin bar soft cap (display only)
const ZOOM_MIN      = 0.35;
const ZOOM_MAX      = 2.6;

/** Mission categories: icon, accent colour, which stat grows. */
const CATEGORIES = {
  gym:    { icon:'💪', color:'#ff007f', stat:'stamina' },
  code:   { icon:'💻', color:'#00f3ff', stat:'intel'   },
  work:   { icon:'💼', color:'#ffd700', stat:'coins'   },
  health: { icon:'❤️', color:'#3dff8a', stat:'stamina' },
};

/** Mutable app state — persisted as a whole to localStorage. */
let state = {
  player:{ exp:0, stamina:0, intel:0, coins:0 },
  missions:[],          // {id,title,category,x,y,respect,items:[{id,text,done}]}
  sound:true,
  routineSeeded:0,      // version of the daily-routine blocks already injected
};

/** UI-only state (not persisted). */
let ui = {
  selectedId:null,      // mission open in the panel
  filter:'all',         // all | active | done
  modalOpen:false,
  pickMode:false,       // next map click sets modal location
  draft:null,           // mission being composed in the modal
  view:{ x:0, y:0, s:0.65 },   // map pan (px) + zoom (scale)
};

const $  = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

const missionDone = m => m.items.length > 0 && m.items.every(i => i.done);

/* ------------------------------------------------------------ *
 * 2. PERSISTENCE — save/load everything to localStorage
 * ------------------------------------------------------------ */
function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.warn('localStorage unavailable, progress will not persist:', e);
  }
}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){ seedMissions(); mergeRoutine(); return; }   // first visit → demo + routine
    const parsed = JSON.parse(raw);
    // Shallow-merge so older saves gain new fields
    state = {
      player:  { ...state.player,  ...(parsed.player  || {}) },
      missions: Array.isArray(parsed.missions) ? parsed.missions : [],
      sound:   typeof parsed.sound === 'boolean' ? parsed.sound : true,
      routineSeeded: typeof parsed.routineSeeded === 'number' ? parsed.routineSeeded : 0,
    };
  }catch(e){
    console.warn('Could not load saved data, starting fresh:', e);
    seedMissions();
  }
  mergeRoutine();       // older saves gain the daily-routine blocks
}

/** First-run demo missions so the map is never empty. */
function seedMissions(){
  state.missions = [
    { id:uid(), title:'Morning Workout', category:'gym', x:640, y:640, respect:150,
      items:[ it('Run 20 minutes'), it('Push-ups 3 × 15'), it('Stretch 5 minutes') ] },
    { id:uid(), title:'Ship Login Feature', category:'code', x:1240, y:740, respect:300,
      items:[ it('Define API contract'), it('Implement endpoint'), it('Write unit tests') ] },
    { id:uid(), title:'Drink 2L of Water', category:'health', x:1900, y:700, respect:60,
      items:[ it('2 glasses — morning'), it('2 glasses — midday'),
              it('2 glasses — afternoon'), it('2 glasses — evening') ] },
  ];
  save();
}

/* Small id + checklist-item helpers */
let idSeq = 0;
function uid(){ return Date.now().toString(36) + (idSeq++).toString(36) + Math.random().toString(36).slice(2,6); }
function it(text){ return { id:uid(), text, done:false }; }

/* ------------------------------------------------------------ *
 * 2b. DAILY ROUTINE — the five blocks of the day, injected once
 *     (ROUTINE_VERSION: bump it to re-offer an updated routine)
 * ------------------------------------------------------------ */
const ROUTINE_VERSION = 1;

const ROUTINE_MISSIONS = [
  {
    title:'Bloque 1 · Backend profundo (90 min)',
    category:'code', x:600, y:980, respect:300,
    items:[
      'Teoría 30% — un solo concepto, ~25 min',
      'Código 70% — escribir código, ~65 min (sin teoría los 90)',
      'Rotar: Node.js · TypeScript · APIs REST · SQL/PostgreSQL',
      'Rotar: MongoDB · Redis · RabbitMQ · microservicios',
      'Rotar: Docker · Kubernetes · testing/Jest · concurrencia',
      'Rotar: DDD · CQRS · SOLID · patrones · seguridad · performance',
    ],
  },
  {
    title:'Bloque 2 · Proyecto Backend (90 min)',
    category:'code', x:1150, y:1150, respect:350,
    items:[
      'UN solo proyecto, no cinco — algo parecido a un backend real',
      'Stack base: Node.js · TypeScript · PostgreSQL · REST API · JWT',
      'Integrar: Redis · RabbitMQ · Docker · Jest',
      'Arquitectura: DDD / hexagonal',
      'Sumar de a uno: autenticación · autorización · validaciones',
      'Endurecer: errores · logs · cache · colas · workers',
      'Cierre: tests · observabilidad · documentación · CI/CD',
    ],
  },
  {
    title:'Bloque 3 · Entrevistas (45 min)',
    category:'work', x:1620, y:1000, respect:250,
    items:[
      '15 min — preguntas técnicas EN VOZ ALTA',
      'Tema: event loop · Promise.all vs Promise.allSettled · errores',
      'Tema: API escalable · microservicio · cuándo RabbitMQ o Redis',
      'Tema: PostgreSQL vs MongoDB · CQRS · DDD · hexagonal vs tradicional',
      '15 min — system design: pagos · notificaciones · reservas · marketplace',
      '15 min — tu experiencia: Contame sobre vos · último trabajo · por qué dejaste',
      'Preparar: proyecto complejo · decisión arquitectónica · "¿Por qué contratarte?"',
    ],
  },
  {
    title:'Bloque 4 · Búsqueda laboral (60 min)',
    category:'work', x:1980, y:950, respect:200,
    items:[
      '20 min — 3 a 5 postulaciones BUENAS (nada de 30 aplicaciones automáticas)',
      'Buscar: Senior/Sr Backend · Node.js Developer · Backend Engineer',
      'Filtro: priorizar Argentina o remoto LATAM',
      '15 min — networking: recruiters, hiring managers, devs de empresas objetivo',
      '10-20 min — seguimiento: respuestas, entrevistas, aplicaciones, contactos',
      'Actualizar la planilla: Empresa · Puesto · Fecha · Estado · Próximo paso',
    ],
  },
  {
    title:'Bloque 5 · IA aplicada al desarrollo (30 min)',
    category:'code', x:980, y:500, respect:150,
    items:[
      'Posicionamiento: Senior Backend que usa AI/agents (no AI Engineer ahora)',
      'Practicar: coding agents · tool calling · workflows',
      'Practicar: RAG · integración con APIs de LLM · agentes',
      'Construir una feature con LLM sobre tu API Node.js — aplicado a backend',
      'Cubrir: evaluación · AI-assisted development · Spec-Driven Development',
    ],
  },
];

/** Inject the routine blocks once per ROUTINE_VERSION, skipping titles that
 *  already exist (so a manual delete stays deleted). Runs on every load. */
function mergeRoutine(){
  if(state.routineSeeded >= ROUTINE_VERSION) return;
  const present = new Set(state.missions.map(m => m.title));
  ROUTINE_MISSIONS.forEach(t => {
    if(present.has(t.title)) return;
    state.missions.push({
      id:uid(), title:t.title, category:t.category,
      x:t.x, y:t.y, respect:t.respect,
      items:t.items.map(text => it(text)),
    });
  });
  state.routineSeeded = ROUTINE_VERSION;
  save();
}

/* ------------------------------------------------------------ *
 * 3. HUD — level, EXP bar, attribute bars
 * ------------------------------------------------------------ */
function renderHUD(){
  const p   = state.player;
  const lvl = Math.floor(p.exp / EXP_PER_LEVEL) + 1;
  const inLvl = p.exp % EXP_PER_LEVEL;

  $('#level-num').textContent = lvl;
  $('#exp-bar').style.width  = (inLvl / EXP_PER_LEVEL * 100).toFixed(1) + '%';
  $('#exp-text').textContent = `${inLvl} / ${EXP_PER_LEVEL} EXP`;

  $('#stamina-bar').style.width = clamp(p.stamina, 0, 100) + '%';
  $('#intel-bar').style.width   = clamp(p.intel,   0, 100) + '%';
  $('#coins-bar').style.width   = clamp(p.coins / COIN_BAR_MAX * 100, 0, 100) + '%';
  $('#coins-num').textContent   = p.coins;
}

/* ------------------------------------------------------------ *
 * 4. MAP — pan / zoom / markers
 * ------------------------------------------------------------ */
const vp       = $('#map-viewport');
const world    = $('#world');
const markersEl= $('#markers');

/** Apply current view (translate + scale) to the world layer. */
function applyView(){
  const v = ui.view;
  world.style.transform = `translate(${v.x}px, ${v.y}px) scale(${v.s})`;
  // Markers counter-scale so pins stay a constant screen size
  world.style.setProperty('--inv', 1 / v.s);
}

/** Keep at least 80px of the map inside the viewport (world spans [x, x+w]). */
function clampView(){
  const v = ui.view;
  const w = WORLD_W * v.s, h = WORLD_H * v.s;
  v.x = clamp(v.x, 80 - w, vp.clientWidth  - 80);
  v.y = clamp(v.y, 80 - h, vp.clientHeight - 80);
}

/** Reset view: fit the whole island centred in the viewport. */
function fitView(){
  const pad = 30;
  const s = clamp(Math.min(
    (vp.clientWidth  - pad*2) / WORLD_W,
    (vp.clientHeight - pad*2) / WORLD_H
  ), ZOOM_MIN, 1.2);
  ui.view.s = s;
  ui.view.x = (vp.clientWidth  - WORLD_W * s) / 2;
  ui.view.y = (vp.clientHeight - WORLD_H * s) / 2;
  applyView();
}

/** Convert client (screen) coords → world coords. */
function toWorld(clientX, clientY){
  const r = vp.getBoundingClientRect();
  return {
    x: (clientX - r.left - ui.view.x) / ui.view.s,
    y: (clientY - r.top  - ui.view.y) / ui.view.s,
  };
}

/* --- Pan / pinch / click handling via Pointer Events --- */
const pointers = new Map();      // active pointers (for pinch zoom)
let drag = null;                 // active single-finger/mouse drag
let moved = false;               // did the pointer travel far enough to be a drag?

vp.addEventListener('pointerdown', e => {
  if(e.target.closest('.marker')) return;      // markers handle their own clicks
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });

  if(pointers.size === 1){
    drag = { startX:e.clientX, startY:e.clientY, vx:ui.view.x, vy:ui.view.y };
    moved = false;
    vp.setPointerCapture(e.pointerId);
    vp.classList.add('dragging');
  }else if(pointers.size === 2){
    // Second finger → switch to pinch mode
    drag = null;
    moved = true;
    const [a,b] = [...pointers.values()];
    pinch = {
      dist: Math.hypot(a.x-b.x, a.y-b.y),
      s0: ui.view.s,
      // world point under the initial midpoint (zoom anchor)
      ...toWorld((a.x+b.x)/2, (a.y+b.y)/2),
    };
  }
});

let pinch = null;

vp.addEventListener('pointermove', e => {
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });

  /* --- Pinch zoom (two fingers) --- */
  if(pointers.size === 2 && pinch){
    const [a,b] = [...pointers.values()];
    const dist = Math.hypot(a.x-b.x, a.y-b.y);
    const r  = vp.getBoundingClientRect();
    const midX = (a.x+b.x)/2 - r.left;
    const midY = (a.y+b.y)/2 - r.top;
    const s = clamp(pinch.s0 * (dist / pinch.dist), ZOOM_MIN, ZOOM_MAX);
    ui.view.s = s;
    ui.view.x = midX - pinch.x * s;      // keep anchored world point under fingers
    ui.view.y = midY - pinch.y * s;
    clampView();
    applyView();
    return;
  }

  /* --- Single-pointer pan --- */
  if(drag){
    const dx = e.clientX - drag.startX;
    const dy = e.clientY - drag.startY;
    if(Math.hypot(dx, dy) > 5) moved = true;   // 5px threshold: drag vs click
    ui.view.x = drag.vx + dx;
    ui.view.y = drag.vy + dy;
    clampView();
    applyView();
  }
});

vp.addEventListener('pointerup', onPointerEnd);
vp.addEventListener('pointercancel', onPointerEnd);

function onPointerEnd(e){
  pointers.delete(e.pointerId);
  vp.classList.remove('dragging');

  if(pointers.size < 2) pinch = null;

  /* A tap (not a drag) on the map → pick location or create mission */
  if(pointers.size === 0){
    if(drag && !moved){
      const w = toWorld(e.clientX, e.clientY);
      handleMapTap(w);
    }
    drag = null;
  }
}

/** Map tap: pick-mode assigns location, otherwise open create modal. */
function handleMapTap(w){
  if(w.x < 0 || w.y < 0 || w.x > WORLD_W || w.y > WORLD_H) return;  // ignore open sea

  if(ui.pickMode && ui.modalOpen){
    ui.draft.x = Math.round(w.x);
    ui.draft.y = Math.round(w.y);
    ui.pickMode = false;
    vp.classList.remove('pick-mode');
    updateLocBox();
    backdrop.classList.remove('hidden');   // reopen the modal with location set
  }else if(!ui.modalOpen){
    openCreateModal(w);
  }
}

/* --- Wheel zoom (anchored under the cursor) --- */
vp.addEventListener('wheel', e => {
  e.preventDefault();
  const r = vp.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const before = toWorld(e.clientX, e.clientY);
  const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  ui.view.s = clamp(ui.view.s * factor, ZOOM_MIN, ZOOM_MAX);
  ui.view.x = mx - before.x * ui.view.s;
  ui.view.y = my - before.y * ui.view.s;
  clampView();
  applyView();
}, { passive:false });

/** Render all mission markers into the world layer. */
function renderMarkers(){
  markersEl.innerHTML = state.missions.map(m => {
    const cat = CATEGORIES[m.category] || CATEGORIES.work;
    const done = missionDone(m);
    return `
      <div class="marker cat-${m.category} ${done ? 'done' : ''}"
           data-id="${m.id}" style="left:${m.x}px; top:${m.y}px"
           title="${escapeHtml(m.title)}">
        <div class="marker-chip"><span>${cat.icon}</span></div>
        <div class="marker-tag">${escapeHtml(m.title)}</div>
      </div>`;
  }).join('');
}

markersEl.addEventListener('click', e => {
  const el = e.target.closest('.marker');
  if(el) openPanel(el.dataset.id);
});

/* ------------------------------------------------------------ *
 * 4b. MISSION LIST (sidebar)
 * ------------------------------------------------------------ */
function renderList(){
  const box = $('#list-scroll');
  const list = state.missions.filter(m => {
    if(ui.filter === 'active') return !missionDone(m);
    if(ui.filter === 'done')   return  missionDone(m);
    return true;
  });

  if(!list.length){
    box.innerHTML = `<div class="list-empty">
      No missions here.<br><b>Click the map</b> to create one!
    </div>`;
    return;
  }

  box.innerHTML = list.map(m => {
    const cat = CATEGORIES[m.category] || CATEGORIES.work;
    const done = missionDone(m);
    const checked = m.items.filter(i => i.done).length;
    return `
      <div class="mission-card ${done ? 'done' : ''} ${m.id === ui.selectedId ? 'selected' : ''}"
           data-id="${m.id}" style="border-left-color:${cat.color}">
        <div class="mc-icon" style="border-color:${cat.color}">${cat.icon}</div>
        <div class="mc-body">
          <div class="mc-title">${escapeHtml(m.title)}</div>
          <div class="mc-meta">
            <span class="mc-respect">+${m.respect} EXP</span>
            <span>${checked}/${m.items.length}</span>
          </div>
        </div>
        ${done ? '<div class="mc-check">✓</div>' : ''}
      </div>`;
  }).join('');
}

$('#list-scroll').addEventListener('click', e => {
  const card = e.target.closest('.mission-card');
  if(card) openPanel(card.dataset.id);
});

$$('.chip').forEach(chip => chip.addEventListener('click', () => {
  $$('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  ui.filter = chip.dataset.filter;
  renderList();
}));

/* ------------------------------------------------------------ *
 * 5. MISSION PANEL — checklist HUD
 * ------------------------------------------------------------ */
const panel = $('#mission-panel');

function openPanel(id){
  const m = state.missions.find(x => x.id === id);
  if(!m) return;

  ui.selectedId = id;
  const cat = CATEGORIES[m.category] || CATEGORIES.work;

  $('#panel-icon').textContent   = cat.icon;
  $('#panel-icon').style.borderColor = cat.color;
  $('#panel-title').textContent  = m.title;
  $('#panel-cat').textContent    = m.category;
  $('#panel-cat').style.color    = cat.color;
  $('#panel-respect').textContent = `+${m.respect} RESPECT`;

  renderPanelItems(m);
  panel.classList.add('open');
  panel.setAttribute('aria-hidden', 'false');

  // On mobile, close the list drawer so the panel is visible
  $('#mission-list').classList.remove('open');
  renderList();
}

function renderPanelItems(m){
  const checked = m.items.filter(i => i.done).length;
  $('#panel-progress-fill').style.width = (checked / m.items.length * 100 || 0) + '%';
  $('#panel-progress-text').textContent = `${checked} / ${m.items.length} completed`;

  $('#panel-items').innerHTML = m.items.map(i => `
    <li class="check-item" data-item="${i.id}">
      <input type="checkbox" ${i.done ? 'checked' : ''}>
      <span class="check-box">✓</span>
      <span class="check-text">${escapeHtml(i.text)}</span>
    </li>`).join('');
}

/* Toggle a checklist item in real time */
$('#panel-items').addEventListener('change', e => {
  const li = e.target.closest('.check-item');
  if(!li) return;
  const m = state.missions.find(x => x.id === ui.selectedId);
  if(!m) return;

  const item = m.items.find(i => i.id === li.dataset.item);
  if(!item) return;

  const before = missionDone(m);
  item.done = e.target.checked;
  const after = missionDone(m);

  sfxCheck(item.done);
  save();

  if(!before && after){
    /* ALL ITEMS COMPLETE → mission accomplished! */
    completeMission(m);
  }else{
    /* Partial progress: refresh HUD/panel/list without celebration */
    if(before && !after){ /* re-open: rewards already granted stay granted */ }
    renderHUD();
    renderPanelItems(m);
    renderList();
    renderMarkers();
  }
});

function closePanel(){
  panel.classList.remove('open');
  panel.setAttribute('aria-hidden', 'true');
  ui.selectedId = null;
  renderList();
}
$('#panel-close').addEventListener('click', closePanel);

$('#panel-delete').addEventListener('click', () => {
  const m = state.missions.find(x => x.id === ui.selectedId);
  if(!m) return;
  if(!confirm(`Delete mission "${m.title}"?`)) return;
  state.missions = state.missions.filter(x => x.id !== m.id);
  save();
  closePanel();
  renderAll();
});

/* ------------------------------------------------------------ *
 * 6. MISSION COMPLETION — rewards + RESPECT+ celebration
 * ------------------------------------------------------------ */
function completeMission(m){
  const cat = CATEGORIES[m.category] || CATEGORIES.work;

  /* Grant rewards ONCE per mission (flag survives re-check after unchecking) */
  const firstGrant = !m.rewardGranted;
  if(firstGrant){
    m.rewardGranted = true;
    state.player.exp    += m.respect;
    state.player.coins  += Math.ceil(m.respect / 10);
    if(cat.stat === 'stamina') state.player.stamina = Math.min(100, state.player.stamina + 8);
    if(cat.stat === 'intel')   state.player.intel   = Math.min(100, state.player.intel   + 8);
  }

  save();
  renderAll();          // marker turns "done", list updates
  renderPanelItems(m);  // progress bar fills
  showRespect(m, firstGrant);
  return firstGrant;
}

/** Full-screen RESPECT+ overlay with synth sound. */
function showRespect(m, firstGrant){
  const big = $('#respect-overlay');
  const bigText = m.respect >= 250 ? 'MISSION<br>RESPECT +' : 'RESPECT +';

  $('#respect-big').innerHTML = bigText;
  $('#respect-sub').textContent = firstGrant
    ? `+${m.respect} EXP · +${Math.ceil(m.respect/10)} COINS`
    : 'MISSION CLEARED · REWARD ALREADY CLAIMED';

  big.style.display = 'grid';
  sfxRespect();

  /* Auto-close after a beat, or on click */
  clearTimeout(showRespect._t);
  showRespect._t = setTimeout(hideRespect, 2600);
  big.onclick = hideRespect;
}
function hideRespect(){
  clearTimeout(showRespect._t);
  $('#respect-overlay').style.display = 'none';
  $('#respect-overlay').onclick = null;
}

/* --- Web Audio: synthetic sounds, zero external files --- */
let audioCtx = null;
function ac(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;                 // very old browser: run silent
    audioCtx = new AC();
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

/** Play one synthetic tone: `type` = square | sawtooth | sine | triangle. */
function tone(freq, start, dur, type='square', gain=0.18){
  if(!state.sound) return;
  const ctx = ac(); if(!ctx) return;
  const t0  = ctx.currentTime + start;
  const osc = ctx.createOscillator();
  const amp = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  amp.gain.setValueAtTime(0, t0);
  amp.gain.linearRampToValueAtTime(gain, t0 + 0.02);        // fast attack
  amp.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);  // decay
  osc.connect(amp).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.05);
}

/** Tick when checking/unchecking a checklist item. */
function sfxCheck(on){
  if(!state.sound) return;
  tone(on ? 880 : 440, 0, 0.09, 'square', 0.12);
}

/** Triumphant ascending arpeggio for RESPECT+ (Vice City flavour). */
function sfxRespect(){
  if(!state.sound) return;
  const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];  // C5 E5 G5 C6 E6
  notes.forEach((f, i) => {
    tone(f, i * 0.11, 0.22, 'square', 0.16);
    tone(f * 0.5, i * 0.11, 0.22, 'triangle', 0.10);         // octave-down body
  });
  tone(1046.50, 0.6, 0.9, 'sawtooth', 0.10);                 // final chord stab
  tone(1318.51, 0.6, 0.9, 'square',   0.08);
  tone(523.25,  0.6, 0.9, 'triangle', 0.10);
}

/* ------------------------------------------------------------ *
 * 7. CREATE MISSION MODAL
 * ------------------------------------------------------------ */
const backdrop = $('#modal-backdrop');

/** Open the modal. `at` = optional world coords {x,y} from a map tap. */
function openCreateModal(at){
  ui.modalOpen = true;
  ui.pickMode  = false;
  ui.draft = {
    id:null,
    title:'',
    category:'gym',
    respect:100,
    x: at ? Math.round(at.x) : null,
    y: at ? Math.round(at.y) : null,
    items:[ it('') ],
  };

  $('#modal-heading').textContent = 'NEW MISSION';
  $('#f-title').value    = '';
  $('#f-category').value = 'gym';
  $('#f-respect').value  = 100;
  renderDraftItems();
  updateLocBox();

  backdrop.classList.remove('hidden');
  $('#f-title').focus();
}

/** Render the dynamic checklist editor from ui.draft.items. */
function renderDraftItems(){
  $('#checklist-rows').innerHTML = ui.draft.items.map((item, idx) => `
    <div class="cl-row" data-idx="${idx}">
      <input type="text" maxlength="80" placeholder="Sub-task ${idx + 1}"
             value="${escapeHtml(item.text)}" data-cl-input>
      <button class="cl-remove" type="button" data-cl-remove title="Remove">✕</button>
    </div>`).join('');
}

/** Reflect the draft's map location in the modal. */
function updateLocBox(){
  const d = ui.draft;
  const el = $('#loc-text');
  if(d && d.x != null){
    el.textContent = `X ${d.x} · Y ${d.y}`;
    el.classList.add('set');
  }else{
    el.textContent = 'NOT SET';
    el.classList.remove('set');
  }
}

/* Modal events ------------------------------------------------ */
$('#btn-new').addEventListener('click', () => {
  // Default location: centre of the current map view
  const r = vp.getBoundingClientRect();
  openCreateModal(toWorld(r.left + r.width/2, r.top + r.height/2));
});

$('#btn-add-item').addEventListener('click', () => {
  ui.draft.items.push(it(''));
  renderDraftItems();
  const rows = $$('#checklist-rows [data-cl-input]');
  rows[rows.length - 1].focus();
});

$('#checklist-rows').addEventListener('input', e => {
  if(e.target.matches('[data-cl-input]')){
    const idx = +e.target.closest('.cl-row').dataset.idx;
    ui.draft.items[idx].text = e.target.value;
  }
});
$('#checklist-rows').addEventListener('click', e => {
  if(e.target.matches('[data-cl-remove]')){
    const idx = +e.target.closest('.cl-row').dataset.idx;
    if(ui.draft.items.length === 1) ui.draft.items[0] = it('');  // keep ≥1 row
    else ui.draft.items.splice(idx, 1);
    renderDraftItems();
  }
});

$('#btn-pick').addEventListener('click', () => {
  ui.pickMode = true;
  vp.classList.add('pick-mode');
  backdrop.classList.add('hidden');       // hide modal while choosing
  $('#map-hint').textContent = 'Tap the map to set the mission location';
});

$('#btn-cancel').addEventListener('click', closeModal);
function closeModal(){
  ui.modalOpen = false;
  ui.pickMode  = false;
  vp.classList.remove('pick-mode');
  backdrop.classList.add('hidden');
  $('#map-hint').textContent = 'Click anywhere on the map to add a mission';
}

/* Save: validate → push mission → render */
$('#btn-save').addEventListener('click', () => {
  const d = ui.draft;
  d.title    = $('#f-title').value.trim();
  d.category = $('#f-category').value;
  d.respect  = clamp(parseInt($('#f-respect').value, 10) || 100, 10, 9999);
  d.items    = d.items.filter(i => i.text.trim());             // drop empties

  if(!d.title){ alert('Give the mission a title.'); $('#f-title').focus(); return; }
  if(!d.items.length){ alert('Add at least one checklist item.'); return; }
  if(d.x == null){ alert('Pick a location on the map first.'); return; }

  state.missions.push({
    id:uid(), title:d.title, category:d.category,
    x:d.x, y:d.y, respect:d.respect,
    items:d.items.map(i => ({ id:i.id, text:i.text.trim(), done:false })),
  });
  save();
  closeModal();
  renderAll();
});

/* Close on backdrop click (outside the modal) or Escape */
backdrop.addEventListener('click', e => { if(e.target === backdrop) closeModal(); });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if(ui.modalOpen) closeModal();
    else if(panel.classList.contains('open')) closePanel();
  }
});

/* ------------------------------------------------------------ *
 * 8. INIT & WIRING
 * ------------------------------------------------------------ */
/** Escape user text before injecting into HTML. */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

/** Full re-render of every dynamic surface. */
function renderAll(){
  renderHUD();
  renderMarkers();
  renderList();
}

/* Header buttons */
$('#btn-sound').addEventListener('click', () => {
  state.sound = !state.sound;
  $('#btn-sound').textContent = state.sound ? '🔊' : '🔇';
  save();
  if(state.sound) sfxCheck(true);
});
$('#btn-list').addEventListener('click', () => {
  $('#mission-list').classList.toggle('open');
});

/* Zoom buttons */
$('#zoom-in').addEventListener('click',  () => zoomBy(1.25));
$('#zoom-out').addEventListener('click', () => zoomBy(1/1.25));
$('#zoom-fit').addEventListener('click', fitView);

function zoomBy(factor){
  const r = vp.getBoundingClientRect();
  const cx = r.width/2, cy = r.height/2;   // zoom around viewport centre
  const before = { x:(cx - ui.view.x)/ui.view.s, y:(cy - ui.view.y)/ui.view.s };
  ui.view.s = clamp(ui.view.s * factor, ZOOM_MIN, ZOOM_MAX);
  ui.view.x = cx - before.x * ui.view.s;
  ui.view.y = cy - before.y * ui.view.s;
  clampView();
  applyView();
}

/* Keep the view sane on window resize */
window.addEventListener('resize', () => { clampView(); applyView(); });

/* Boot: load saved state, fit map, render everything */
load();
$('#btn-sound').textContent = state.sound ? '🔊' : '🔇';
requestAnimationFrame(() => { fitView(); renderAll(); });
</script>
